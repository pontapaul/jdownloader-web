services:
  jdownloader-2:
    image: jlesage/jdownloader-2
    container_name: jdownloader-2
    restart: unless-stopped
    ports:
      - "5800:5800" # GUI web di JDownloader2 (noVNC)
    volumes:
      - ./jd2-config:/config:rw
      - ${DOWNLOADS_DIR:-./downloads}:/output:rw
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - TZ=${TZ:-Europe/Rome}
    networks:
      proxy:
        # nginx.conf proxies /api/ to http://jdownloader:3128
        aliases: [jdownloader]

  jdownloader-web:
    build:
      context: .
      args:
        VITE_JD_API_URL: /api
    image: jdownloader-web
    container_name: jdownloader-web
    restart: unless-stopped
    # No published ports: the reverse proxy reaches it on the shared network
    networks:
      - proxy

networks:
  proxy:
    external: true

services:
  jdownloader-2:
    image: jlesage/jdownloader-2
    container_name: jdownloader-2
    restart: unless-stopped
    ports:
      - "5800:5800" # GUI web di JDownloader2 (noVNC)
    volumes:
      - ./jd2-config:/config:rw
      # Staging area (fast disk): downloads and extraction happen here
      - ${DOWNLOADS_DIR:-./downloads}:/output:rw
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - TZ=${TZ:-Europe/Rome}
    networks:
      proxy:
        # nginx.conf proxies /api/ to http://jdownloader:3128
        aliases: [jdownloader]

  jdownloader-web:
    build:
      context: .
      args:
        VITE_JD_API_URL: /api
    image: jdownloader-web
    container_name: jdownloader-web
    restart: unless-stopped
    # No published ports: the reverse proxy reaches it on the shared network
    volumes:
      # Read-only, for the destination picker (nginx lists folder names only)
      - ${MOVIES_DIR:-./library/movies}:/library/movies:ro
      - ${SHOWS_DIR:-./library/shows}:/library/shows:ro
    networks:
      - proxy

  # Moves finished and extracted packages from the staging area to the library
  jdownloader-mover:
    build: ./mover
    image: jdownloader-mover
    container_name: jdownloader-mover
    restart: unless-stopped
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    environment:
      - TZ=${TZ:-Europe/Rome}
    volumes:
      - ${DOWNLOADS_DIR:-./downloads}:/output:rw
      # /output/<name>/... is moved to /library/<name>/...
      - ${MOVIES_DIR:-./library/movies}:/library/movies:rw
      - ${SHOWS_DIR:-./library/shows}:/library/shows:rw
      - ${OTHER_DIR:-./library/downloads}:/library/downloads:rw
    networks:
      - proxy

networks:
  proxy:
    external: true
